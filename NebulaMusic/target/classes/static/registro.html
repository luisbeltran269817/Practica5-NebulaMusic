<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            
            <!-- TAREA PARA EL ALUMNO:
                 Crea un formulario que envíe los datos mediante POST a "/crear-cuenta".
                 Debe contener campos para:
                 - Nombre completo (texto)
                 - Correo electrónico (email)
                 - Contraseña (password)
                 - Pseudónimo (texto con patrón de validación: [letras de 3 a 10]-[números de 2 a 10])
                 - Género (radio buttons: Femenino, Masculino, Otro)
                 - Tipo de Suscripción (select: Gratis, Premium Mensual, Premium Anual)
                 - Fecha de nacimiento (date)
                 - Aceptar términos y condiciones (checkbox)
                 - Comentarios adicionales o gustos (textarea)
            -->
            <form class="auth-form" method="post" action="/crear-cuenta">
                <h1>Crear cuenta</h1>
                <div>
                    <label for="nombre">Nombre completo: </label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ej: Luis Carlos"
                        required
                        minlength="3"
                        maxlength="100"
                    >
                </div>

                <div>
                    <label for="email">Email: </label>
                    <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="usuario@dominio"
                            required
                    >
                </div>

                <div>
                    <label for="contrasena">Contraseña: </label>
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        required
                    >
                </div>

                <div>
                    <label for="pseudonimo">Pseudonimo</label>
                    <input
                        type="text"
                        id="pseudonimo"
                        name="pseudonimo"
                        required
                        pattern="[a-zA-Z]{3-10}-[0-9]{2,10}"
                        placeholder="Nebula-2026"
                    >
                </div>

                <div>
                    <label>Genero</label>
                    <div>
                        <input type="radio" id="rad_fem" name = "genero" value="femenino" required>
                        <label for="rad_fem">Femenino</label>
                        <input type="radio" id="rad_mas" name = "genero" value="masculino" required>
                        <label for="rad_mas">Masculino</label>
                        <input type="radio" id="mobiliario" name = "genero" value="mobiliario" required>
                        <label for="mobiliario">Mobiliario</label>
                    </div>
                </div>

                <div>
                    <label for="suscripcion">Tipo de suscripcion</label>
                    <select id="suscripcion" name="suscripcion" required>
                        <option value="">-- Selecciona una opcion--</option>
                        <option value="gratis">Gratis (con anuncios)</option>
                        <option value="premium_mensual">Premium Mensual - $99</option>
                        <option value="premium_mensual">Premium Anual - $899</option>
                    </select>
                </div>

                <div>
                    <label for="fechaNacimiento">Fecha de nacimiento: </label>
                    <input
                        type="date"
                        id="fechaNacimiento"
                        name="fechaNacimiento"
                        required
                    >
                </div>

                <div>
                    <input
                        type = checkbox
                        id="terminos"
                        name="terminos"
                        value="aceptado"
                        required
                    >
                    <label for="terminos">Acepto los TyC de uso</label>
                </div>

                <div>
                    <label for="comentarios">Comentarios y preferencias</label>
                    <textarea
                        id="comentarios"
                        name="comentarios"
                        rows="4"
                        cols="40"
                        placeholder="Cuentanos que musica te gusta (igual nadie lee esto xddd)">
                    </textarea>
                </div>

                <div>
                    <button type="submit">Registrarse</button>
                    <button type="reset">Limpiar formulario</button>
                </div>
            </form>
            <p>
                ¿Ya tienes una cuenta? <a href="iniciar-sesion.html">Iniciar sesion aqui</a>
            </p>

        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
